</button> </div> <p id="mensaje" class="mt-4 font-semibold"></p> <script type="module">const d=JSON.parse(localStorage.getItem("user"));d||window.location.replace("/login");d.rol_id!==1&&window.location.replace("/admin");const l=localStorage.getItem("token");async function m(){try{const e=await(await fetch("http://localhost:3000/api/auth/profile",{headers:{Authorization:`Bearer ${l}`}})).json();document.getElementById("email").value=e.email,document.getElementById("estado").textContent=e.estado,document.getElementById("rol").textContent=e.rol_id===2?"Administrador":"Usuario",document.getElementById("fecha").textContent=new Date(e.fecha_registro).toLocaleDateString()}catch(a){console.error(a)}}async function g(){const a=document.getElementById("email").value;try{const e=await fetch("http://localhost:3000/api/auth/profile",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:`Bearer ${l}`},body:JSON.stringify({email:a})}),i=await e.json(),n=document.getElementById("mensaje");if(!e.ok){n.className="mt-4 text-red-600 font-semibold",n.textContent=i.error;return}n.className="mt-4 text-green-600 font-semibold",n.textContent=i.message,t.disabled=!0,t.classList.add("bg-gray-100"),o.classList.remove("hidden"),r.classList.add("hidden"),s.classList.add("hidden"),localStorage.setItem("user",JSON.stringify({...d,email:a}))}catch(e){console.error(e)}}const t=document.getElementById("email"),o=document.getElementById("editarBtn"),r=document.getElementById("guardarBtn"),s=document.getElementById("cancelarBtn");let c="";document.getElementById("guardarBtn").addEventListener("click",g);o.addEventListener("click",()=>{c=t.value,t.disabled=!1,t.classList.remove("bg-gray-100"),o.classList.add("hidden"),r.classList.remove("hidden"),s.classList.remove("hidden")});s.addEventListener("click",()=>{t.value=c,t.disabled=!0,t.classList.add("bg-gray-100"),o.classList.remove("hidden"),r.classList.add("hidden"),s.classList.add("hidden")});m();</script>  </main> </body></html>
