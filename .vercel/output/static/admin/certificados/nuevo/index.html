<!DOCTYPE html><html lang="es"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nuevo Modelo</title><link rel="stylesheet" href="/_astro/global.BwKOf-Su.css"></head> <body class="bg-slate-100 min-h-screen"> <div class="flex"> <aside class="w-72 bg-slate-900 text-white min-h-screen p-6 flex flex-col"> <h2 id="sidebarTitle" class="text-3xl font-bold mb-10">
ADMIN PANEL
</h2> <nav class="flex flex-col gap-4 flex-1"> <a href="/admin" class="hover:bg-slate-800 px-4 py-3 rounded-xl transition">
Dashboard
</a> <a href="/admin/usuarios" class="solo-admin hover:bg-slate-800 px-4 py-3 rounded-xl transition">
Usuarios
</a> <a href="/admin/certificados" class="hover:bg-slate-800 px-4 py-3 rounded-xl transition">
Certificados
</a> <a href="/admin/solicitudes" class="hover:bg-slate-800 px-4 py-3 rounded-xl transition">
Solicitudes
</a> <a href="/admin/perfil" class="hover:bg-slate-800 px-4 py-3 rounded-xl transition">
Mi Perfil
</a> </nav> <button id="logoutBtn" class="bg-red-500 text-white px-4 py-3 rounded-xl hover:bg-red-600 w-full transition">
Cerrar sesión
</button> </aside> <script type="module">document.getElementById("logoutBtn").addEventListener("click",()=>{localStorage.removeItem("token"),localStorage.removeItem("user"),window.location.replace("/login")});const t=localStorage.getItem("user");if(t&&JSON.parse(t).rol_id===3){const e=document.getElementById("sidebarTitle");e&&(e.textContent="REVISOR PANEL"),document.querySelectorAll(".solo-admin").forEach(o=>{o.remove()})}</script> <main class="flex-1 p-8">  <div class="bg-white rounded-3xl shadow-md p-8"> <h1 class="text-3xl font-bold text-slate-800 mb-2">
Crear Modelo de Certificado
</h1> <p class="text-gray-500 mb-8">
Registra un nuevo modelo de certificado.
</p> <div class="space-y-6"> <div> <label class="block mb-2 font-semibold">
Nombre
</label> <input id="nombre" type="text" class="w-full border rounded-xl px-4 py-3" placeholder="Nombre del certificado"> </div> <div> <label class="block mb-2 font-semibold">
Descripción
</label> <textarea id="descripcion" rows="5" class="w-full border rounded-xl px-4 py-3" placeholder="Descripción del certificado"></textarea> </div> <button id="crearBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 transition">
Crear modelo
</button> <p id="mensaje" class="font-semibold"></p> </div> </div> <script type="module">const r=localStorage.getItem("token");async function a(){const o=document.getElementById("nombre").value,c=document.getElementById("descripcion").value;try{const e=await fetch("http://localhost:3000/api/certificados/modelos",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${r}`},body:JSON.stringify({nombre:o,descripcion:c})}),n=await e.json(),t=document.getElementById("mensaje");if(!e.ok){t.className="text-red-600 font-semibold",t.textContent=n.error;return}t.className="text-green-600 font-semibold",t.textContent=n.message,document.getElementById("nombre").value="",document.getElementById("descripcion").value=""}catch(e){console.error(e)}}document.getElementById("crearBtn").addEventListener("click",a);</script>  </main> </div> </body></html>
