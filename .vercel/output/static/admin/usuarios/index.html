</a> </nav> <button id="logoutBtn" class="bg-red-500 text-white px-4 py-3 rounded-xl hover:bg-red-600 w-full transition">
Cerrar sesión
</button> </aside> <script type="module">document.getElementById("logoutBtn").addEventListener("click",()=>{localStorage.removeItem("token"),localStorage.removeItem("user"),window.location.replace("/login")});const t=localStorage.getItem("user");if(t&&JSON.parse(t).rol_id===3){const e=document.getElementById("sidebarTitle");e&&(e.textContent="REVISOR PANEL"),document.querySelectorAll(".solo-admin").forEach(o=>{o.remove()})}</script> <main class="flex-1 p-8">  <div class="bg-white rounded-3xl shadow-md p-8"> <div class="flex justify-between items-center mb-6"> <h1 class="text-3xl font-bold text-slate-800">Lista de Usuarios</h1> </div> <div class="overflow-x-auto mb-6"> <table class="w-full text-left border-collapse"> <thead> <tr class="border-b text-slate-600 bg-slate-50"> <th class="py-3 px-4">ID</th> <th class="py-3 px-4">Email</th> <th class="py-3 px-4">Rol</th> <th class="py-3 px-4">Estado</th> </tr> </thead> <tbody id="usuariosTableBody" class="text-slate-700"></tbody> </table> </div> <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl"> <span id="pageIndicator" class="text-sm text-gray-600">Página 1</span> <div class="flex gap-2"> <button id="prevPageBtn" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl hover:bg-slate-300 disabled:opacity-50 font-medium transition" disabled>

</button> </div> </div> </div> <script type="module">let t=1;const m=5;async function d(n){try{const e=document.getElementById("usuariosTableBody"),r=localStorage.getItem("token");if(!r){window.location.replace("/login");return}const i=await fetch(`https://certificados-deploy80-production.up.railway.app/api/auth/users?page=${n}&limit=${m}`,{method:"GET",headers:{"Content-Type":"application/json",Authorization:`Bearer ${r}`}});if(!i.ok)throw new Error("No se pudo obtener la información de los usuarios");const o=await i.json();e&&(e.innerHTML="",o.usuarios.forEach(a=>{const s=document.createElement("tr");s.className="border-b hover:bg-slate-50 transition",s.innerHTML=`
              <td class="py-3 px-4 font-bold">${a.id}</td>
              <td class="py-3 px-4">${a.email}</td>
              <td class="py-3 px-4">

              <td class="py-3 px-4">
                <span class="text-green-600 font-medium">${a.estado||"activo"}</span>
              </td>
            `,e.appendChild(s)}));const c=document.getElementById("pageIndicator");c&&(c.textContent=`Página ${n} de ${o.totalPages||1}`);const l=document.getElementById("prevPageBtn"),p=document.getElementById("nextPageBtn");l&&(l.disabled=n===1),p&&(p.disabled=n===o.totalPages||o.usuarios.length<m)}catch(e){console.error("Error al conectar con la API de usuarios:",e)}}document.getElementById("prevPageBtn")?.addEventListener("click",()=>{t>1&&(t--,d(t))});document.getElementById("nextPageBtn")?.addEventListener("click",()=>{t++,d(t)});d(t);</script>  </main> </div> </body></html>
