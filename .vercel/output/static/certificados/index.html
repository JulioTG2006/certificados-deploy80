<!DOCTYPE html><html lang="es"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Certificados</title><link rel="stylesheet" href="/_astro/global.D0dzQpt2.css"></head> <body class="bg-slate-100 min-h-screen"> <nav class="bg-white shadow-md"> <div class="max-w-7xl mx-auto px-8 py-4 flex justify-between items-center"> <div class="text-2xl font-bold text-blue-600">

</div> <div class="flex gap-6 items-center"> <a href="/dashboard" class="text-gray-700 hover:text-blue-600 font-medium">
Dashboard
</a> <a href="/certificados" class="text-gray-700 hover:text-blue-600 font-medium">
Certificados
</a> <a href="/solicitudes" class="text-gray-700 hover:text-blue-600 font-medium">
Solicitudes
</a> <a href="/perfil" class="text-gray-700 hover:text-blue-600 font-medium">

</a> <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-xl hover:bg-red-600">

</button> </div> </div> </nav> <script type="module">document.getElementById("logoutBtn").addEventListener("click",()=>{localStorage.removeItem("token"),localStorage.removeItem("user"),window.location.href="/login"});</script> <main class="max-w-7xl mx-auto p-8">  <div class="mb-8"> <h1 class="text-4xl font-bold text-slate-800">

</div> </div> <script type="module">async function t(){try{const r=await(await fetch("https://certificados-deploy80-production.up.railway.app/api/certificados/modelo")).json(),o=document.getElementById("certificadosContainer");o.innerHTML="",r.forEach(e=>{o.innerHTML+=`

              </h2>

                  >
                    Ver detalle
                  </a>

                  <a
                    href="/certificados/preview/${e.id}"
                    class="bg-green-600 text-white px-5 py-3 rounded-xl hover:bg-green-700 transition inline-block"
                  >
                    Vista previa
                  </a>

              </div>

            </div>
          `})}catch(i){console.error(i)}}t();</script>  </main> </body></html>
