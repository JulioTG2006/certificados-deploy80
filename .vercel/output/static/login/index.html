<!DOCTYPE html><html lang="es"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Iniciar sesión</title><link rel="stylesheet" href="/_astro/global.BwKOf-Su.css"></head> <body class="bg-slate-100 min-h-screen flex items-center justify-center">  <div class="w-full max-w-md bg-white shadow-xl rounded-3xl p-10"> <div class="text-center mb-8"> <h1 class="text-4xl font-bold text-blue-600">
CERTIFICADOS
</h1> <p class="text-gray-500 mt-2">
Inicia sesión para continuar
</p> </div> <form id="loginForm" class="space-y-5"> <input type="email" id="email" placeholder="Correo electrónico" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"> <input type="password" id="password" placeholder="Contraseña" required class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"> <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition">
Ingresar
</button> </form> <p id="message" class="text-red-500 text-center mt-4"></p> <div class="text-center mt-6"> <a href="/register" class="text-blue-600 hover:underline">
¿No tienes cuenta? Regístrate
</a> </div> </div> <script type="module">const a=document.getElementById("loginForm"),o=document.getElementById("message");a.addEventListener("submit",async n=>{n.preventDefault();const r=document.getElementById("email").value,s=document.getElementById("password").value;try{const t=await fetch("http://localhost:3000/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:r,password:s})}),e=await t.json();if(!t.ok){o.textContent=e.error;return}localStorage.setItem("token",e.token),localStorage.setItem("user",JSON.stringify(e.user)),e.user.rol_id===1?window.location.href="/dashboard":(e.user.rol_id===2||e.user.rol_id===3)&&(window.location.href="/admin")}catch{o.textContent="Error conectando con servidor"}});</script>  </body></html>
